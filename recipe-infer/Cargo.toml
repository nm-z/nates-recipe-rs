[package]
name = "recipe-infer"
version = "0.1.0"
edition = "2024"
description = "GPU forward-pass inference: pure tensor fns, ogdl/safetensors weight loading, device lifecycle"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../README.md"
keywords = ["inference", "gpu", "hip", "safetensors", "tensor"]
categories = ["science::ml"]

[lib]
name = "recipe_infer"

[dependencies]
anyhow = "1"
libc = "0.2"
gpu-core = { path = "../gpu-core" }
tokenizers = "0.21"
ndarray = "0.16"
ogdl = { path = "../ogdl" }

[lints]
workspace = true
