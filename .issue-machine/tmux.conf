new-session -d -s recipe-issue-machine /home/nate/Desktop/recipe-issue-machine/.issue-machine/run
select-pane -d -t recipe-issue-machine:0.0
set -g history-limit 20000
set -g mouse on
set -g status-interval 1
set -g status-style 'bg=#161b22,fg=#8b949e'
set -g status-left '#[fg=#56d6a9,bold]  recipe issue machine'
set -g status-left-length 32
set -g status-right '#[fg=#7d8590]%H:%M:%S  '
set -g status-right-length 12
set -g window-status-format ''
set -g window-status-current-format ''
set -g message-style 'bg=#161b22,fg=#e5c07b'
set -g mode-style 'bg=#30363d,fg=#f0f6fc'
