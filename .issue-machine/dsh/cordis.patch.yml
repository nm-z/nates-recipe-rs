- id: tools
  config:
    mode: native
- id: system-prompt
  config:
    persona: You classify Recipe traversal failures using repository evidence and complete GitHub issue history.
- id: agent-loop
  config:
    agents: []
    maxParallelToolCalls: !!js Number(process.env.RECIPE_MACHINE_DSH_PARALLEL_TOOL_CALLS)
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.RECIPE_MACHINE_REPOSITORY
- id: fs-sandbox
  config:
    cwd: !!js process.env.RECIPE_MACHINE_REPOSITORY
- id: llm-pi-ai
  config:
    providers: !!js >-
      Object.fromEntries([
        ['recipe-opencode', {
          displayName: 'OpenCode Zen',
          apiKeyEnv: 'RECIPE_MACHINE_OPENCODE_API_KEY',
          api: 'openai-completions',
          baseURL: process.env.RECIPE_MACHINE_DSH_OPENCODE_BASE_URL,
          defaultContextWindow: Number(process.env.RECIPE_MACHINE_DSH_CONTEXT_WINDOW),
          defaultMaxTokens: Number(process.env.RECIPE_MACHINE_DSH_MAX_TOKENS),
          compat: { supportsDeveloperRole: false, maxTokensField: 'max_tokens' },
          headers: { Authorization: '' },
          models: process.env.RECIPE_MACHINE_DSH_OPENCODE_MODELS.split(',').filter(Boolean).map((id) => ({ id })),
        }],
        ['openrouter', {
          apiKeyEnv: 'RECIPE_MACHINE_OPENROUTER_API_KEY',
          api: 'openai-completions',
          baseURL: process.env.RECIPE_MACHINE_DSH_OPENROUTER_BASE_URL,
          defaultContextWindow: Number(process.env.RECIPE_MACHINE_DSH_CONTEXT_WINDOW),
          defaultMaxTokens: Number(process.env.RECIPE_MACHINE_DSH_MAX_TOKENS),
          models: process.env.RECIPE_MACHINE_DSH_OPENROUTER_MODELS.split(',').filter(Boolean).map((id) => ({ id })),
        }],
      ].filter(([, provider]) => provider.models.length > 0))
- insert:
    - id: recipe-machine-credentials
      name: recipe-machine-dsh/credentials
      config:
        openCodeAuthPath: !!js process.env.RECIPE_MACHINE_OPENCODE_AUTH_PATH
        openCodeRef: RECIPE_MACHINE_OPENCODE_API_KEY
        openCodeValue: !!js process.env.RECIPE_MACHINE_DSH_OPENCODE_CREDENTIAL
        openRouterRef: RECIPE_MACHINE_OPENROUTER_API_KEY
        openRouterProvider: !!js process.env.RECIPE_MACHINE_DSH_OPENROUTER_AUTH_PROVIDER
    - id: recipe-issues-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: recipe_issues
        transport: stdio
        command: !!js process.env.RECIPE_MACHINE_ISSUE_READER
        args: []
        cwd: !!js process.env.RECIPE_MACHINE_REPOSITORY
        failOnStartupError: true
    - id: recipe-machine-dsh
      name: recipe-machine-dsh
      inject: [agents, tools]
      config:
        socketPath: !!js process.env.RECIPE_MACHINE_DSH_SOCKET
        repository: !!js process.env.RECIPE_MACHINE_REPOSITORY
        openCodeProvider: recipe-opencode
        maxPromptBytes: !!js Number(process.env.RECIPE_MACHINE_DSH_MAX_PROMPT_BYTES)
        maxTurns: !!js Number(process.env.RECIPE_MACHINE_DSH_MAX_TURNS)
