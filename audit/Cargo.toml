[package]
name = "recipe-audit"
version = "0.1.0"
edition = "2024"
description = "Deterministic native-interface and vendor-library audit gate for Recipe"
license = "MIT"
publish = false

[lib]
name = "recipe_audit"

[[bin]]
name = "recipe-audit"
path = "src/main.rs"

[dependencies]
goblin = { version = "0.10", default-features = false, features = ["elf32", "elf64", "endian_fd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
