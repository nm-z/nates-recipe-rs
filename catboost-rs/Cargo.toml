[package]
name = "catboost-rs"
version = "0.1.0"
edition = "2024"
description = "CatBoost training — ordered boosting with categorical features"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../README.md"
keywords = ["catboost", "gradient-boosting", "gpu", "categorical", "trees"]
categories = ["science::ml"]

[dependencies]
gpu-core = { path = "../gpu-core" }
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
[lints]
workspace = true
