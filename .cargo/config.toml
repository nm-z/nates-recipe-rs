[build]
jobs = 12

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "target-cpu=native",
    "-C", "link-arg=-fuse-ld=mold",
]

[net]
retry = 3
git-fetch-with-cli = true

[registries.crates-io]
protocol = "sparse"

[term]
color = "auto"

[alias]
c = "check"
cw = "clippy --workspace"
cwa = "clippy --workspace --all-targets"
br = "build --release"
rr = "run --release"
tr = "test --release"
