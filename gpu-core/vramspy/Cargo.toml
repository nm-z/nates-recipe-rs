[package]
name = "vramspy"
version = "0.1.0"
edition = "2024"
description = "LD_PRELOAD HSA interposer counting library-side GPU VRAM by pool-owning agent"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../../README.md"
keywords = ["vram", "hsa", "rocm", "ld-preload", "gpu"]
categories = ["hardware-support"]

[lib]
name = "vramspy"
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
ogdl = { path = "../../ogdl" }

[lints]
workspace = true
