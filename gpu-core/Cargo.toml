[package]
name = "gpu-core"
version = "0.1.0"
edition = "2024"
description = "GPU-native f64 HIP/CUDA compute kernels with a tagged memory ledger"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../README.md"
keywords = ["gpu", "hip", "rocm", "kernels", "cuda"]
categories = ["science", "hardware-support"]

[dependencies]
half = "2"
libc = "0.2"
log = { path = "../log" }
ogdl = { path = "../ogdl" }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }

[dev-dependencies]
serde_json = "1"
libm = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
