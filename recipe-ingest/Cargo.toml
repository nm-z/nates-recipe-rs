[package]
name = "recipe-ingest"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Dependency-clean external representation and framing for Recipe"

[dependencies]
calamine = "0.36"
csv = "1"
quick-xml = "0.41"
recipe-core = { path = "../recipe-core" }
recipe-ogdl = { path = "../recipe-ogdl" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
