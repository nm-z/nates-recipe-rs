[package]
name = "lightgbm-rs"
version = "0.1.0"
edition = "2024"
description = "LightGBM-equivalent gradient boosting — leaf-wise growth, GOSS, EFB — on ROCm/HIP"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../README.md"
keywords = ["lightgbm", "gbdt", "goss", "efb", "gpu"]
categories = ["science::ml"]

[dependencies]
gpu-core = { path = "../gpu-core" }
ogdl = { path = "../ogdl" }
rand = "0.9"
rand_chacha = "0.9"

[[bin]]
name = "bench"
path = "src/bench.rs"
[lints]
workspace = true
