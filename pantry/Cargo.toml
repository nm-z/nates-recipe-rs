[package]
name = "pantry"
version = "0.1.0"
edition = "2024"
description = "Dataset loading and encoding: CSV/ARFF/zip/image-dir parsing, NaN policy, and a trained char-level column-type detector"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "../README.md"
keywords = ["csv", "arff", "dataset", "encoding", "parsing"]
categories = ["science::ml", "parsing"]

[lib]
name = "pantry"

[dependencies]
recipe-infer = { path = "../recipe-infer" }
recipe-ir = { path = "../recipe-ir" }
ogdl = { path = "../ogdl" }
anyhow = "1"
csv = "1"
ndarray = "0.16"
image = "0.25"
data-encoding = "2.11.0"
zip = "2"
rand = "0.9"
rand_chacha = "0.9"
rayon = "1"
serde_json = "1"
parquet = { version = "59", features = ["arrow"] }
arrow = "59"
calamine = "0.36"
quick-xml = "0.41"
apache-avro = "0.21"
hdf5 = { package = "hdf5-metno", version = "0.13" }
matfile = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
[lints]
workspace = true
