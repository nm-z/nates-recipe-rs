[package]
name = "recipe-native-executor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native CUDA Driver and ROCr/HSA execution resources for Recipe"

[dependencies]
recipe-core = { path = "../recipe-core" }
recipe-cuda = { path = "../recipe-cuda" }
