[package]
name = "recipe-text"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded tokenizer and chat metadata transformations for Recipe"
publish = false

[dependencies]
hf-chat-template = { version = "0.2", features = ["strftime"] }
recipe-ingest = { path = "../recipe-ingest" }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
