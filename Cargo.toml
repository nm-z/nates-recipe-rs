[package]
name = "recipe"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "src/recipe.rs"

[[bin]]
name = "train"
path = "train.rs"

[package.metadata.recipe]
balance-bytes-per-flop = 0.5
hsa-architecture = "gfx1101"
hsa-compiler = "/opt/rocm/lib/llvm/bin/clang"
hsa-library = "/opt/rocm/lib"
hsa-device-library = "/opt/rocm/amdgcn/bitcode/ocml.bc"
hsa-isa-library = "/opt/rocm/amdgcn/bitcode/oclc_isa_version_1101.bc"
hsa-finite-library = "/opt/rocm/amdgcn/bitcode/oclc_finite_only_off.bc"
hsa-math-library = "/opt/rocm/amdgcn/bitcode/oclc_unsafe_math_off.bc"

[package.metadata.train]
epochs = 300
learning-rate = 0.08
finite-difference-step = 0.0001
initial-weight = 0.25
input-features = 2
hidden-neurons = 4
output-neurons = 1
maximum-final-loss = 0.0001
adamw-beta1 = 0.9
adamw-beta2 = 0.999
adamw-epsilon = 0.00000001
adamw-weight-decay = 0.0
leak-slope = 0.01
prelu-initial-slope = 0.25
elu-alpha = 1.0
selu-alpha = 1.6732632423543772
selu-scale = 1.0507009873554805
gelu-scale = 0.7978845608028654
gelu-cubic = 0.044715
normalization-epsilon = 0.00000001
gpu-threads = 256
random-seed = 1
