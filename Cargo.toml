[package]
name = "recipe"
version = "0.1.1"
edition = "2024"
autotests = false
description = "Capability-driven AOT scheduling and execution for AMD and NVIDIA GPUs"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "neural-network", "distributed"]
categories = ["science::ml"]

[lib]
name = "recipe"
doctest = false

[[bin]]
name = "recipe"
path = "src/main.rs"
test = false

[[example]]
name = "cookbook"
test = true

[workspace]
resolver = "3"
members = [
	".",
	"audit",
	"acceptance",
	"cluster",
	"core",
	"cuda",
	"executor",
	"host",
	"hsa",
	"ingest",
	"kernel",
	"language",
	"math",
	"native-executor",
	"native-probe",
	"ogdl",
	"ops",
	"planner",
	"prepare",
	"primitives",
	"program",
	"probe",
	"remote",
	"scheduler",
	"text",
	"training",
	"transport",
]

[workspace.package]
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "runtime", "distributed"]
categories = ["science::ml"]

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
recipe-cluster = { path = "cluster" }
recipe-core = { path = "core" }
recipe-cuda = { path = "cuda" }
recipe-executor = { path = "executor" }
recipe-host = { path = "host" }
recipe-hsa = { path = "hsa" }
recipe-ingest = { path = "ingest" }
recipe-kernel = { path = "kernel" }
recipe-language = { path = "language" }
recipe-math = { path = "math" }
recipe-native-executor = { path = "native-executor" }
recipe-native-probe = { path = "native-probe" }
recipe-ogdl = { path = "ogdl" }
recipe-ops = { path = "ops" }
recipe-planner = { path = "planner" }
recipe-prepare = { path = "prepare" }
recipe-primitives = { path = "primitives" }
recipe-program = { path = "program" }
recipe-probe = { path = "probe" }
recipe-remote = { path = "remote" }
recipe-scheduler = { path = "scheduler" }
recipe-text = { path = "text" }
recipe-training = { path = "training" }
recipe-transport = { path = "transport" }
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["full", "visit"] }

[lints]
workspace = true

[profile.release]
# overrides
overflow-checks = true
lto = "thin"
# defaults
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.dev]
# overrides
opt-level = 1
# defaults
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
# overrides
debug = false

[workspace.lints.rust]
# overrides
unsafe_code = "warn"
# defaults
warnings = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# overrides
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
needless_return = "allow"
# defaults
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
min_ident_chars = "allow"
indexing_slicing = "allow"
semicolon_outside_block = "allow"
arithmetic_side_effects = "allow"
question_mark_used = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
inline_trait_bounds = "allow"
unseparated_literal_suffix = "allow"
float_arithmetic = "allow"
mod_module_files = "allow"
default_numeric_fallback = "allow"
as_conversions = "allow"
arbitrary_source_item_ordering = "allow"
impl_trait_in_params = "allow"
integer_division = "allow"
exhaustive_structs = "allow"
missing_trait_methods = "allow"
integer_division_remainder_used = "allow"
pub_without_shorthand = "allow"
pub_with_shorthand = "allow"
