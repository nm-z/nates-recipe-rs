[package]
name = "recipe"
version = "0.1.1"
edition = "2024"
autotests = false
description = "Capability-driven AOT scheduling and execution for AMD and NVIDIA GPUs"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "neural-network", "distributed"]
categories = ["science::ml"]

[lib]
name = "recipe"
test = true
doctest = false

[[bin]]
name = "recipe"
path = "src/main.rs"
test = false

[[test]]
name = "facade-boundary"
path = "tests/facade_boundary.rs"

[[test]]
name = "public-api-compile"
path = "tests/public_api_compile.rs"

[[test]]
name = "training-reporting"
path = "tests/training_reporting.rs"

[[test]]
name = "source-runner"
path = "tests/source_runner.rs"

[workspace]
resolver = "3"
members = [
	".",
	"recipe-audit",
	"recipe-cluster",
	"recipe-core",
	"recipe-cuda",
	"recipe-executor",
	"recipe-host",
	"recipe-hsa",
	"recipe-ingest",
	"recipe-kernel",
	"recipe-language",
	"recipe-math",
	"recipe-native-executor",
	"recipe-native-probe",
	"recipe-ogdl",
	"recipe-ops",
	"recipe-planner",
	"recipe-prepare",
	"recipe-primitives",
	"recipe-program",
	"recipe-probe",
	"recipe-remote",
	"recipe-scheduler",
	"recipe-text",
	"recipe-training",
	"recipe-transport",
]

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
recipe-cluster = { path = "recipe-cluster" }
recipe-core = { path = "recipe-core" }
recipe-cuda = { path = "recipe-cuda" }
recipe-executor = { path = "recipe-executor" }
recipe-host = { path = "recipe-host" }
recipe-hsa = { path = "recipe-hsa" }
recipe-ingest = { path = "recipe-ingest" }
recipe-kernel = { path = "recipe-kernel" }
recipe-language = { path = "recipe-language" }
recipe-math = { path = "recipe-math" }
recipe-native-executor = { path = "recipe-native-executor" }
recipe-native-probe = { path = "recipe-native-probe" }
recipe-ogdl = { path = "recipe-ogdl" }
recipe-ops = { path = "recipe-ops" }
recipe-planner = { path = "recipe-planner" }
recipe-prepare = { path = "recipe-prepare" }
recipe-primitives = { path = "recipe-primitives" }
recipe-program = { path = "recipe-program" }
recipe-probe = { path = "recipe-probe" }
recipe-remote = { path = "recipe-remote" }
recipe-scheduler = { path = "recipe-scheduler" }
recipe-text = { path = "recipe-text" }
recipe-training = { path = "recipe-training" }
recipe-transport = { path = "recipe-transport" }
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["full", "visit"] }

[lints]
workspace = true

[profile.release]
# overrides
overflow-checks = true
lto = "thin"
# defaults
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.dev]
# overrides
opt-level = 1
# defaults
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
# overrides
debug = false

[workspace.lints.rust]
# overrides
unsafe_code = "warn"
# defaults
warnings = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# overrides
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
needless_return = "allow"
# defaults
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
min_ident_chars = "allow"
indexing_slicing = "allow"
semicolon_outside_block = "allow"
arithmetic_side_effects = "allow"
question_mark_used = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
inline_trait_bounds = "allow"
unseparated_literal_suffix = "allow"
float_arithmetic = "allow"
mod_module_files = "allow"
default_numeric_fallback = "allow"
as_conversions = "allow"
arbitrary_source_item_ordering = "allow"
impl_trait_in_params = "allow"
integer_division = "allow"
exhaustive_structs = "allow"
missing_trait_methods = "allow"
integer_division_remainder_used = "allow"
pub_without_shorthand = "allow"
pub_with_shorthand = "allow"
