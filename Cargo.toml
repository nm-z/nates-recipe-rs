[package]
name = "recipe"
version = "0.1.1"
edition = "2024"
autotests = false
description = "Capability-driven AOT scheduling and execution for AMD and NVIDIA GPUs"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "neural-network", "distributed"]
categories = ["science::ml"]

[lib]
name = "recipe"
doctest = false

[[bin]]
name = "recipe"
path = "src/main.rs"
test = false

[[bin]]
name = "rpc"
path = "src/bin/rpc.rs"
test = false

[[bin]]
name = "tokenize"
path = "src/bin/tokenize.rs"
test = false
required-features = ["tokenize"]

[[example]]
name = "cookbook"
test = true

[features]
default = []
tokenize = ["dep:hf-chat-template", "dep:tokenizers"]

[workspace]
resolver = "3"
members = [
	".",
	"core",
	"cuda",
	"executor",
	"host",
	"hsa",
	"ingest",
	"kernel",
	"language",
	"write",
	"math",
	"native-executor",
	"native-probe",
	"ogdl",
	"ops",
	"planner",
	"prepare",
	"primitives",
	"program",
	"probe",
	"scheduler",
	"training",
]

[workspace.package]
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "runtime", "distributed"]
categories = ["science::ml"]

[dependencies]
libc = "0.2"
hf-chat-template = { version = "0.2", features = ["strftime"], optional = true }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
recipe-core = { path = "core" }
recipe-cuda = { path = "cuda" }
recipe-executor = { path = "executor" }
recipe-host = { path = "host" }
recipe-hsa = { path = "hsa" }
recipe-ingest = { path = "ingest" }
recipe-kernel = { path = "kernel" }
recipe-language = { path = "language" }
write = { path = "write" }
recipe-math = { path = "math" }
recipe-native-executor = { path = "native-executor" }
recipe-native-probe = { path = "native-probe" }
recipe-ogdl = { path = "ogdl" }
recipe-ops = { path = "ops" }
recipe-planner = { path = "planner" }
recipe-prepare = { path = "prepare" }
recipe-primitives = { path = "primitives" }
recipe-program = { path = "program" }
recipe-probe = { path = "probe" }
recipe-scheduler = { path = "scheduler" }
recipe-training = { path = "training" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
syn = { version = "2.0.117", features = ["full", "visit"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"], optional = true }
toml = "0.9"

[lints]
workspace = true

[profile.release]
# overrides
overflow-checks = true
lto = "thin"
# defaults
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.dev]
# overrides
opt-level = 1
# defaults
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
# overrides
debug = false

[workspace.lints.rust]
# overrides
unsafe_code = "warn"
# defaults
warnings = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# overrides
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
missing_errors_doc = "allow"
needless_return = "allow"
missing_docs_in_private_items = "allow"
missing_inline_in_public_items = "allow"
exhaustive_enums = "allow"
absolute_paths = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
single_call_fn = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
shadow_unrelated = "allow"
partial_pub_fields = "allow"
multiple_inherent_impl = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
tests_outside_test_module = "allow"
separated_literal_suffix = "deny"
let_underscore_untyped = "allow"
little_endian_bytes = "allow"
too_long_first_doc_paragraph = "allow"
wildcard_imports = "allow"
# defaults
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
min_ident_chars = "allow"
indexing_slicing = "allow"
semicolon_outside_block = "allow"
arithmetic_side_effects = "allow"
question_mark_used = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
inline_trait_bounds = "allow"
unseparated_literal_suffix = "allow"
float_arithmetic = "allow"
mod_module_files = "allow"
default_numeric_fallback = "allow"
as_conversions = "allow"
arbitrary_source_item_ordering = "allow"
impl_trait_in_params = "allow"
integer_division = "allow"
exhaustive_structs = "allow"
missing_trait_methods = "allow"
integer_division_remainder_used = "allow"
pub_without_shorthand = "allow"
pub_with_shorthand = "allow"
