[package]
name = "recipe"
version = "0.1.1"
edition = "2024"
autotests = false
description = "ML training + inference for AMD/NVIDIA GPUs"
license = "MIT"
repository = "https://github.com/nm-z/nates-recipe-rs"
readme = "README.md"
keywords = ["machine-learning", "gpu", "hip", "neural-network"]
categories = ["science::ml"]

[lib]
name = "recipe"
test = false
doctest = false

[[bin]]
name = "recipe"
path = "src/main.rs"
test = false

[[bin]]
name = "detect"
path = "src/bin/detect.rs"
test = false
required-features = ["legacy"]

[[test]]
name = "all"
