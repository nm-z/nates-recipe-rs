[package]
name = "recipe"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
path = "recipe.rs"

[[bin]]
name = "train"
path = "train.rs"

[[bin]]
name = "recipe"
path = "cli.rs"

[dependencies]

[package.metadata.recipe]
dependency-allowlist = []
hsa-compiler = "/opt/rocm/lib/llvm/bin/clang"
hsa-disassembler = "/opt/rocm/lib/llvm/bin/llvm-objdump"
hsa-library = "/opt/rocm/lib"
hsa-runtime = "libhsa-runtime64.so.1"
hsa-device-library = "/opt/rocm/amdgcn/bitcode/ocml.bc"
hsa-clock-library = "/opt/rocm/amdgcn/bitcode/ockl.bc"
hsa-device-library-directory = "/opt/rocm/amdgcn/bitcode"
hsa-finite-library = "/opt/rocm/amdgcn/bitcode/oclc_finite_only_off.bc"
hsa-math-library = "/opt/rocm/amdgcn/bitcode/oclc_unsafe_math_off.bc"
nvidia-minimum-architecture = "sm_70"
nvidia-ptx = "ptx71"
nvidia-compiler = "/usr/bin/clang"
nvidia-library = "/usr/lib"
nvidia-runtime = "libcuda.so.1"
nvidia-device-library = "/opt/cuda/nvvm/libdevice/libdevice.10.bc"
ssh-config = ".ssh/config"

[package.metadata.train]
multi-device = false
epochs = 210
learning-rate = 0.0092
initial-weight = 0.01
adamw-beta1 = 0.9
adamw-beta2 = 0.999
adamw-epsilon = 0.00000001
adamw-weight-decay = 0.01
kmeans-iterations = 8
svm-iterations = 128
svm-learning-rate = 0.1
svm-regularization = 0.001
svm-epsilon = 0.1
tree-depth = 5
tree-min-rows = 4
forest-feature-fraction = 0.7
bayes-prior-precision = 0.001
bayes-noise-variance = 1.0
bayes-variance-epsilon = 0.000001
boost-iterations = 8
boost-learning-rate = 0.1
catboost-ordered-prior = 1.0
xgboost-l2-regularization = 1.0
xgboost-minimum-gain = 0.000001
lightgbm-histogram-bins = 16
lightgbm-leaves = 8
quantization-block-weights = 64
surrogate-epochs = 8
surrogate-rate = 0.01
surrogate-width = 8
rat-batch-rows = 32
topology-latency-bytes = 8
topology-bandwidth-bytes = 1048576
topology-probe-repetitions = 4
tile-vram-unit-bytes = 1073741824
ssh-connect-timeout-seconds = 5
random-seed = 17
progress-refresh-hz = 240
normalization-epsilon = 0.00001
categorical-ratio = 0.5
leak-slope = 0.01
prelu-slope = 0.25
elu-alpha = 1.0
selu-alpha = 1.6732632423543772
selu-scale = 1.0507009873554805
gelu-scale = 0.7978845608028654
gelu-cubic = 0.044715
huber-threshold = 1.0
output-tolerance = 0.00000001
gradient-tolerance = 0.00001
backend-tolerance = 0.00001
