[package]
name = "recipe"
version = "0.1.1"
edition = "2024"

[lib]
name = "recipe"
test = false

[[bin]]
name = "recipe"
path = "src/main.rs"
test = false

[[test]]
name = "all"
harness = false

[workspace]
members = [".", "recipe-infer", "pantry", "vramspy", "gpu-core", "log", "ogdl"]
exclude = ["catboost-rs", "xgboost-rs", "lightgbm-rs"]

[dependencies]
gpu-core = { path = "gpu-core" }
recipe-infer = { path = "recipe-infer" }
pantry = { path = "pantry" }
ogdl = { path = "ogdl" }
anyhow = "1"
csv = "1"
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-stats = "0.6"
rayon = "1"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
image = "0.25"
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
libc = "0.2"
indicatif = { version = "0.17", features = ["rayon"] }
data-encoding = "2.11.0"
zip = "2"


[lints]
workspace = true

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
debug = false
[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
restriction = { level = "deny", priority = -1 }
blanket_clippy_restriction_lints = "allow"
