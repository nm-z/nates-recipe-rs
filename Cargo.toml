[workspace]
resolver = "3"
members = [
	".",
	"recipe-audit",
	"recipe-cluster",
	"recipe-infer",
	"recipe-ir",
	"recipe-runtime",
	"recipe-core",
	"recipe-cuda",
	"recipe-executor",
	"recipe-hsa",
	"recipe-host",
	"recipe-ingest",
	"recipe-kernel",
	"recipe-language",
	"recipe-math",
	"recipe-native-executor",
	"recipe-native-probe",
	"recipe-ops",
	"recipe-planner",
	"recipe-prepare",
	"recipe-primitives",
	"recipe-probe",
	"recipe-remote",
	"recipe-scheduler",
	"recipe-text",
	"recipe-transport",
	"pantry",
	"gpu-core/vramspy",
	"gpu-core",
	"ogdl",
	"catboost-rs",
	"xgboost-rs-broken",
	"lightgbm-rs",
]

[features]
default = ["legacy"]
legacy = [
	"dep:anyhow",
	"dep:crossterm",
	"dep:csv",
	"dep:data-encoding",
	"dep:gpu-core",
	"dep:half",
	"dep:image",
	"dep:libc",
	"dep:ndarray",
	"dep:ndarray-stats",
	"dep:ogdl",
	"dep:pantry",
	"dep:rand",
	"dep:rand_chacha",
	"dep:rand_distr",
	"dep:ratatui",
	"dep:rayon",
	"dep:recipe-infer",
	"dep:recipe-ir",
	"dep:recipe-runtime",
	"dep:tui-textarea",
	"dep:unicode-width",
	"dep:zip",
]
next = [
	"dep:recipe-core",
	"dep:recipe-cluster",
	"dep:recipe-cuda",
	"dep:recipe-executor",
	"dep:recipe-hsa",
	"dep:recipe-host",
	"dep:recipe-ingest",
	"dep:recipe-kernel",
	"dep:recipe-language",
	"dep:recipe-math",
	"dep:recipe-native-executor",
	"dep:recipe-native-probe",
	"dep:recipe-ops",
	"dep:recipe-planner",
	"dep:recipe-prepare",
	"dep:recipe-primitives",
	"dep:recipe-probe",
	"dep:recipe-remote",
	"dep:recipe-scheduler",
	"dep:recipe-text",
	"dep:recipe-transport",
]

[dependencies]
recipe-core = { path = "recipe-core", optional = true }
recipe-cluster = { path = "recipe-cluster", optional = true }
recipe-cuda = { path = "recipe-cuda", optional = true }
recipe-executor = { path = "recipe-executor", optional = true }
recipe-hsa = { path = "recipe-hsa", optional = true }
recipe-host = { path = "recipe-host", optional = true }
recipe-ingest = { path = "recipe-ingest", optional = true }
recipe-kernel = { path = "recipe-kernel", optional = true }
recipe-language = { path = "recipe-language", optional = true }
recipe-math = { path = "recipe-math", optional = true }
recipe-native-executor = { path = "recipe-native-executor", optional = true }
recipe-native-probe = { path = "recipe-native-probe", optional = true }
recipe-ops = { path = "recipe-ops", optional = true }
recipe-planner = { path = "recipe-planner", optional = true }
recipe-prepare = { path = "recipe-prepare", optional = true }
recipe-primitives = { path = "recipe-primitives", optional = true }
recipe-probe = { path = "recipe-probe", optional = true }
recipe-remote = { path = "recipe-remote", optional = true }
recipe-scheduler = { path = "recipe-scheduler", optional = true }
recipe-text = { path = "recipe-text", optional = true }
recipe-transport = { path = "recipe-transport", optional = true }
gpu-core = { path = "gpu-core", optional = true }
recipe-infer = { path = "recipe-infer", optional = true }
recipe-ir = { path = "recipe-ir", optional = true }
pantry = { path = "pantry", optional = true }
ogdl = { path = "ogdl", optional = true }
recipe-runtime = { path = "recipe-runtime", optional = true }
anyhow = { version = "1", optional = true }
csv = { version = "1", optional = true }
ndarray = { version = "0.16", features = ["rayon"], optional = true }
ndarray-stats = { version = "0.6", optional = true }
rayon = { version = "1", optional = true }
rand = { version = "0.9", optional = true }
rand_chacha = { version = "0.9", optional = true }
rand_distr = { version = "0.5", optional = true }
half = { version = "2", optional = true }
image = { version = "0.25", optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
tui-textarea = { version = "0.7", optional = true }
unicode-width = { version = "0.2", optional = true }
libc = { version = "0.2", optional = true }
data-encoding = { version = "2.11.0", optional = true }
zip = { version = "2", optional = true }


[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
libm = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
# overrides
overflow-checks = true
lto = "thin"
# defaults
opt-level = 3
debug = false
strip = "none"
debug-assertions = false
panic = "unwind"
incremental = false
codegen-units = 16
rpath = false

[profile.dev]
# overrides
opt-level = 1
# defaults
debug = true
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
# overrides
debug = false

[workspace.lints.rust]
# overrides
unsafe_code = "warn"
# defaults
warnings = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# overrides
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
blanket_clippy_restriction_lints = "allow"
needless_return = "allow"
# defaults
suspicious = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
min_ident_chars = "allow"
indexing_slicing = "allow"
semicolon_outside_block = "allow"
arithmetic_side_effects = "allow"
question_mark_used = "allow"
pub_use = "allow"
single_char_lifetime_names = "allow"
inline_trait_bounds = "allow"
unseparated_literal_suffix = "allow"
float_arithmetic = "allow"
mod_module_files = "allow"
default_numeric_fallback = "allow"
as_conversions = "allow"
arbitrary_source_item_ordering = "allow"
impl_trait_in_params = "allow"
integer_division = "allow"
exhaustive_structs = "allow"
missing_trait_methods = "allow"
integer_division_remainder_used = "allow"
pub_without_shorthand = "allow"
pub_with_shorthand = "allow"
